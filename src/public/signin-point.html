<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module" src="./assets/js/init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Local de Coleta</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/form.css">
</head>
<body>
    <header>
        <a class="logo" href="/index.html">
            <h1>Cata-Junto</h1>
        </a>
        <button class="theme-btn" id="theme-btn"><b>L/D</b></button>
    </header>

    <div class="form-container">
        <h2>Logar como Local de Coleta</h2>
        <form id="form">
            <span class="form-item">
                <label for="email">Digite seu E-Mail:</label>
                <input type="email" name="email" id="email-input" placeholder="Email" required autocomplete="email">
            </span>
            <hr>
            <span class="form-item">
                <label for="password">Digite sua senha:</label>
                <input type="password" name="password" id="password-input" placeholder="Password" required autocomplete="current-password">
            </span>
            <hr>
            <input type="submit" id="submit-button" value="Login">
        </form>
        <p id="form-feedback" role="alert" aria-live="polite"></p>
        <hr>
        <ul class="form-actions">
            <li><a href="signup-point.html">Cadastrar-se como Local de Coleta</a></li>
            <li><a href="signin.html">Logar como Cooperado</a></li>
            <li><a href="forget-password-point.html">Esqueci a Senha</a></li>
        </ul>
    </div>

    <script type='module' src='assets/js/themeToggle.js'></script>

    <script type="module">
        const form = document.getElementById("form");
        const emailInput = document.getElementById("email-input");
        const passwordInput = document.getElementById("password-input");
        const submitButton = document.getElementById("submit-button");
        const feedback = document.getElementById("form-feedback");

        function set_feedback(message, kind) {
            feedback.textContent = message;
            feedback.dataset.kind = kind || "";
        }

        function set_loading(is_loading) {
            submitButton.disabled = is_loading;
            submitButton.value = is_loading ? "Entrando..." : "Login";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            set_feedback("", "");

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                set_feedback("Preencha e-mail e senha.", "error");
                return;
            }

            set_loading(true);

            try {
                const response = await fetch("/login/location", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email, password }),
                });

                let payload = null;
                try { payload = await response.json(); } catch (_) {}

                if (!response.ok) {
                    const friendly = {
                        400: "Preencha e-mail e senha corretamente.",
                        401: "E-mail ou senha incorretos.",
                        403: "Conta inativa.",
                        500: "Erro no servidor. Tente novamente.",
                    };
                    set_feedback(
                        friendly[response.status] || payload?.error || "Falha no login.",
                        "error"
                    );
                    return;
                }

                set_feedback(payload?.message || "Login efetuado.", "success");
                window.location.href = "/collection-point-page.html";

            } catch (err) {
                console.error("login error:", err);
                set_feedback("Não foi possível conectar ao servidor.", "error");
            } finally {
                set_loading(false);
            }
        });
    </script>
</body>
</html>
