<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script type="module" src="./assets/js/init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a Senha — Local de Coleta</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/form.css">
</head>
<body>
    <header>
        <a class="logo" href="/index.html">
            <h1>Cata-Junto</h1>
        </a>
        <button class="theme-btn" id="theme-btn"><b>L/D</b></button>
    </header>

    <div class="form-container">
        <h2>Resetar senha de um local de coleta</h2>

        <form id="request-form">
            <span class="form-item">
                <label for="email">Digite seu E-Mail:</label>
                <input type="email" id="email-input" placeholder="Email" required autocomplete="email">
            </span>
            <hr>
            <input type="submit" id="request-button" value="Enviar Código">
        </form>
        <p id="request-feedback" class="form-feedback" role="alert" aria-live="polite"></p>

        <hr>

        <form id="reset-form" hidden>
            <span class="form-item">
                <label for="code">Código recebido:</label>
                <input type="text" id="code-input" placeholder="000000" inputmode="numeric" maxlength="6" required>
            </span>
            <hr>
            <span class="form-item">
                <label for="password">Nova senha:</label>
                <input type="password" id="password-input" placeholder="Senha" required autocomplete="new-password">
            </span>
            <span class="form-item">
                <label for="password-confirm">Confirme a nova senha:</label>
                <input type="password" id="password-confirm-input" placeholder="Confirme a senha" required autocomplete="new-password">
            </span>
            <hr>
            <input type="submit" id="reset-button" value="Redefinir Senha">
        </form>
        <p id="reset-feedback" class="form-feedback" role="alert" aria-live="polite"></p>

        <hr>
        <ul class="form-actions">
            <li><a href="signin.html">Logar como Cooperado</a></li>
            <li><a href="signin-point.html">Logar como Local de Coleta</a></li>
        </ul>
    </div>

    <script type="module" src="./assets/js/themeToggle.js"></script>

    <script type="module">
        const request_form   = document.getElementById("request-form");
        const reset_form     = document.getElementById("reset-form");
        const email_input    = document.getElementById("email-input");
        const code_input     = document.getElementById("code-input");
        const password_input = document.getElementById("password-input");
        const password_conf  = document.getElementById("password-confirm-input");
        const request_btn    = document.getElementById("request-button");
        const reset_btn      = document.getElementById("reset-button");
        const request_fb     = document.getElementById("request-feedback");
        const reset_fb       = document.getElementById("reset-feedback");

        function set_feedback(el, message, kind) {
            el.textContent = message;
            el.dataset.kind = kind || "";
        }

        function set_loading(btn, is_loading, label) {
            btn.disabled = is_loading;
            btn.value = is_loading ? "..." : label;
        }

        code_input.addEventListener("input", () => {
            code_input.value = code_input.value.replace(/\D/g, "").slice(0, 6);
        });

        request_form.addEventListener("submit", async (event) => {
            event.preventDefault();
            set_feedback(request_fb, "", "");

            const email = email_input.value.trim();
            if (!email) {
                set_feedback(request_fb, "Informe o e-mail.", "error");
                return;
            }

            set_loading(request_btn, true, "Enviar Código");

            try {
                const res = await fetch("/password-reset/collection-location/request", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email }),
                });

                let payload = null;
                try { payload = await res.json(); } catch (_) {}

                if (!res.ok) {
                    set_feedback(
                        request_fb,
                        payload?.error || "Falha ao solicitar código.",
                        "error"
                    );
                    return;
                }

                set_feedback(
                    request_fb,
                    "Se o e-mail existir, um código foi enviado. Verifique sua caixa de entrada.",
                    "success"
                );

                reset_form.hidden = false;
                code_input.value = "";
                password_input.value = "";
                password_conf.value = "";
                set_feedback(reset_fb, "", "");
            } catch (err) {
                console.error("request reset error:", err);
                set_feedback(request_fb, "Não foi possível conectar ao servidor.", "error");
            } finally {
                set_loading(request_btn, false, "Enviar Código");
            }
        });

        reset_form.addEventListener("submit", async (event) => {
            event.preventDefault();
            set_feedback(reset_fb, "", "");

            const email    = email_input.value.trim();
            const code     = code_input.value.trim();
            const password = password_input.value;
            const confirm  = password_conf.value;

            if (!email || !code || !password || !confirm) {
                set_feedback(reset_fb, "Preencha todos os campos.", "error");
                return;
            }
            if (code.length !== 6) {
                set_feedback(reset_fb, "Código deve ter 6 dígitos.", "error");
                return;
            }
            if (password !== confirm) {
                set_feedback(reset_fb, "As senhas não coincidem.", "error");
                return;
            }

            set_loading(reset_btn, true, "Redefinir Senha");

            try {
                const res = await fetch("/password-reset/collection-location", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email, password, code }),
                });

                let payload = null;
                try { payload = await res.json(); } catch (_) {}

                if (!res.ok) {
                    if (payload?.errors) {
                        const first = Object.values(payload.errors)[0];
                        set_feedback(reset_fb, String(first), "error");
                        return;
                    }
                    set_feedback(reset_fb, payload?.error || "Falha ao redefinir senha.", "error");
                    return;
                }

                set_feedback(reset_fb, "Senha redefinida! Redirecionando...", "success");
                setTimeout(() => {
                    window.location.href = "/signin-point.html";
                }, 1500);
            } catch (err) {
                console.error("reset error:", err);
                set_feedback(reset_fb, "Não foi possível conectar ao servidor.", "error");
            } finally {
                set_loading(reset_btn, false, "Redefinir Senha");
            }
        });
    </script>
</body>
</html>
